---
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ADMIN_BASIC_AUTH_USER: ${ADMIN_BASIC_AUTH_USER}
      ADMIN_BASIC_AUTH_HASH: ${ADMIN_BASIC_AUTH_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - map-api
      - news-service
      - umami
      - grafana

  frontend:
    image: orthohantavirus-frontend-prod
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    build:
      context: ./frontend
      args:
        VITE_MAP_API_BASE_URL: /api/map
        VITE_NEWS_API_BASE_URL: /api/news
        VITE_UMAMI_SRC: /analytics/script.js
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}
    restart: unless-stopped

  map-api:
    build:
      context: ./backend
    command: uvicorn services.map_api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      SERVICE_NAME: map-api
      APP_ENV: ${APP_ENV}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  news-service:
    build:
      context: ./backend
    command: uvicorn services.news_service.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      SERVICE_NAME: news-service
      APP_ENV: ${APP_ENV}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  data-ingestion:
    build:
      context: ./backend
    command: python -m services.data_ingestion run-all
    profiles: ["tools"]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      SERVICE_NAME: data-ingestion
      APP_ENV: ${APP_ENV}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      INGESTION_DEFAULT_SOURCES: ${INGESTION_DEFAULT_SOURCES}
      INGESTION_WRITE_PUBLIC: ${INGESTION_WRITE_PUBLIC}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./infra/minio/init-buckets.sh:/scripts/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    depends_on:
      minio:
        condition: service_healthy

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 20

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${ADMIN_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

  alloy:
    image: grafana/alloy:v1.5.1
    command: run /etc/alloy/config.alloy
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

volumes:
  caddy_data:
  caddy_config:
  minio_data:
  umami_db_data:
  grafana_data:
  loki_data:
