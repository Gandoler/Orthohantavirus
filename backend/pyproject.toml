[project]
name = "orthohantavirus-backend"
version = "0.1.0"
description = "Backend services for the Orthohantavirus Map project"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.115",
    "httpx>=0.27",
    "orjson>=3.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "tenacity>=8.5",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "shared*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
